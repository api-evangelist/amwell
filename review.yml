aid: amwell
name: Amwell
review:
  question: Does Amwell expose an anonymously documented public API or FHIR CapabilityStatement?
  answer: false
  date: '2026-07-24'
  reviewer: API Evangelist
  homeMarket: United States
findings:
  summary: |
    CORRECTED 2026-08-15. The 2026-07-24 review recorded a "real, live developer
    portal" at https://developers.amwell.com. That was wrong. amwell.com serves a
    WILDCARD vhost: any subdomain — including ones that do not exist — answers
    HTTP 200 with the consumer Amwell "Online Care" sign-up application
    (/landing.htm for a browser user agent, /updateBrowser.htm otherwise).
    Control probes of zzz-not-a-real-host-9x.amwell.com and
    randomtest12345.amwell.com both returned 200 /landing.htm, and the same
    wildcard answers on docs., apidocs., partners., sdk., trust., security. and
    mcp.amwell.com. Amwell therefore has NO developer portal at all — not a
    gated one. The Converge platform is publicly described (press + platform
    pages) as an open architecture whose APIs leverage HL7 FHIR, with single
    sign-on, embedded telehealth SDKs (iOS, Android, web), a verified Epic App
    Orchard integration, and an embedded solution inside Oracle Cerner
    Millennium — but the only published route to any of it is a sales
    conversation or SDK@americanwell.com. No anonymous FHIR CapabilityStatement,
    SMART-on-FHIR configuration, OpenAPI, GraphQL, AsyncAPI, MCP server, A2A
    agent card or llms.txt exists on any Amwell host.
  developerPortal:
    url: null
    httpStatus: null
    confirmed: false
    gated: true
    note: >-
      No developer portal exists. developers.amwell.com returns 200 only because
      *.amwell.com is a wildcard serving the consumer telehealth app; verified by
      control probe against non-existent subdomains on 2026-08-15. SDK and API
      access is requested by email (SDK@americanwell.com) or the partner contact
      form.
  fhirCapabilityStatement:
    found: false
    version: null
    resources: []
    note: >-
      https://fhir.amwell.com/metadata, /R4/metadata, and /fhir/metadata all
      returned HTTP 404; the fhir.amwell.com host serves the same browser-check
      gate, not an anonymous FHIR endpoint.
  smartConfiguration:
    found: false
    note: >-
      https://fhir.amwell.com/.well-known/smart-configuration and
      /.well-known/openid-configuration both returned HTTP 404.
  downloadableSpecs:
    count: 0
    note: >-
      Probed /openapi.json, /swagger.json, /api-docs on developers.amwell.com and
      docs.amwell.com — all HTTP 404. No spec harvested verbatim.
  authModel:
    scheme: SMART-on-FHIR / OAuth2 + single sign-on (partner-provisioned)
    verified: false
    note: >-
      Publicly described as FHIR-leveraging with single sign-on; the exact OAuth2
      scopes and grant types are behind the gated partner portal and could not be
      confirmed anonymously.
  standardsConformance:
    fhir: referenced (Converge platform "APIs leverage FHIR")
    usCore: unconfirmed
    daVinci: unconfirmed
    carinBlueButton: unconfirmed
    hl7: referenced
  gatedVsSelfServe: gated (sales/partner gate — no developer portal of any kind, no anonymous public spec)
  transports:
    - protocol: REST
      scheme: https
      documented: gated
      note: Converge platform REST APIs behind the partner developer portal.
    - protocol: FHIR
      scheme: https
      documented: gated
      note: APIs leverage HL7 FHIR per Amwell platform materials; no anonymous CapabilityStatement served.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in any anonymously reachable Amwell material.
sources:
  - url: https://developers.amwell.com
    type: WildcardFalsePositive
    note: >-
      HTTP 200, but only because *.amwell.com is a wildcard vhost serving the
      consumer telehealth sign-up app. Not a developer portal. Retracted as a
      DeveloperPortal source on 2026-08-15.
  - url: https://repo1.maven.org/maven2/com/americanwell/android/webrtc/1.0.1/webrtc-1.0.1.pom
    type: Packages
    note: >-
      Only first-party Amwell artifact on any public registry — com.americanwell.android:webrtc
      1.0.1, Apache-2.0, published 2023-06-13, POM organization "American Well".
  - url: https://business.amwell.com/the-amwell-platform
    type: Documentation
    note: Converge platform overview (virtual care, EHR integration, Carepoint devices).
  - url: https://www.mobihealthnews.com/news/amwell-looks-third-party-device-integrations-launch-converge
    type: Reference
    note: Reports Converge APIs leverage FHIR and offer single sign-on with open architecture.
  - url: https://business.amwell.com/about-us/news/press-releases/2016/first-ever-telehealth-mobile-sdk
    type: Reference
    note: American Well's first-ever telehealth mobile SDK for embedding visits into consumer apps.
actions:
  apisYmlUpdated: true
  reason: |
    Cataloged the real, publicly-described Converge platform API family (Converge
    Platform API, Telehealth SDK, EHR Integration) with the confirmed live but
    gated developer portal as the documentation surface. No OpenAPI or FHIR
    CapabilityStatement was harvested because none is served anonymously.
maintainers:
