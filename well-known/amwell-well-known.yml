note: >-
  Every /.well-known/ path probed on every Amwell host returned 404 or was
  answered by a wildcard catch-all serving the consumer telehealth HTML app.
  NO WellKnown or SecurityTxt pointer is emitted in apis.yml, because not one
  path returned a real document. This file records a verified ABSENCE.
wildcard_warning: >-
  amwell.com serves a wildcard vhost: ANY subdomain — including hosts that do
  not exist — answers HTTP 200 with the consumer Amwell "Online Care" sign-up
  application (redirecting to /landing.htm, or /updateBrowser.htm for
  non-browser user agents). Control probes of zzz-not-a-real-host-9x.amwell.com
  and randomtest12345.amwell.com both returned 200 /landing.htm. Any 200 from a
  *.amwell.com subdomain is therefore NOT evidence that the named surface
  exists. This is what previously caused developers.amwell.com, docs.amwell.com,
  apidocs.amwell.com, mcp.amwell.com, sdk.amwell.com, trust.amwell.com and
  partners.amwell.com to read as live surfaces; none of them are.
