name: Amwell
kind: company
description: Amwell (American Well) is a United States telehealth and hybrid-care
  technology company headquartered in Boston, Massachusetts, whose Converge platform
  delivers virtual and in-person care at scale for health systems, health plans, and
  government programs. Converge is built on an open architecture whose APIs leverage
  HL7 FHIR, single sign-on, and embedded telehealth mobile and web SDKs (iOS, Android,
  web) so partners can plug urgent, scheduled, behavioral, and specialty virtual visits
  directly into their own consumer apps, patient portals, and clinical workflows. Amwell
  ships verified embedded-telehealth integrations with the Epic and Oracle Cerner EHRs
  and connects software-enabled Carepoint devices. The developer surface is a gated
  partner developer portal (developers.amwell.com) — the REST/FHIR API reference, SDKs,
  and sandbox sit behind a partner login rather than an anonymous public spec.
