name: Amwell
kind: company
description: Amwell (American Well) is a United States telehealth and hybrid-care
  technology company headquartered in Boston, Massachusetts, whose Converge platform
  delivers virtual and in-person care at scale for health systems, health plans,
  employers, and government programs. Amwell describes Converge as an open architecture
  whose APIs leverage HL7 FHIR and single sign-on, with embedded telehealth mobile and
  web SDKs (iOS, Android, web) so partners can plug urgent, scheduled, behavioral, and
  specialty virtual visits directly into their own consumer apps, patient portals, and
  clinical workflows. Amwell ships a verified embedded-telehealth integration with Epic
  through the Epic App Orchard and an embedded telehealth solution inside Oracle Cerner
  Millennium, and connects software-enabled Carepoint devices. Amwell publishes no
  public developer portal, API reference, or machine-readable specification of any kind
  — SDK and API access is arranged through a partner and sales conversation
  (SDK@americanwell.com), so the integration contract is not readable before a deal.
