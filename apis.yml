apis:
- aid: amwell:amwell-converge-platform-api
  name: Amwell Converge Platform API
  description: Amwell's Converge platform REST APIs, which Amwell states leverage
    HL7 FHIR and single sign-on, let partners embed and orchestrate virtual care —
    urgent, scheduled, behavioral, and specialty visits — into their own
    applications, patient portals, and clinical workflows. No public API reference,
    base URL, or specification is published; access is arranged with Amwell under a
    partner agreement.
  humanURL: https://business.amwell.com/the-amwell-platform
  tags:
  - Telehealth
  - FHIR
  - Virtual Care
  properties:
  - type: Documentation
    url: https://business.amwell.com/the-amwell-platform
- aid: amwell:amwell-telehealth-sdk
  name: Amwell Telehealth SDK
  description: Amwell's embedded telehealth software development kits for iOS,
    Android, and web, enabling organizations to plug live virtual visits directly
    into their own consumer and clinical applications. The SDK is distributed to
    partners on request (SDK@americanwell.com) rather than through a public package
    registry; the only first-party Amwell artifact on any public registry is the
    Android WebRTC media binary on Maven Central.
  humanURL: https://business.amwell.com/press-release/first-ever-telehealth-mobile-sdk/
  tags:
  - SDK
  - Telehealth
  - Mobile
  properties:
  - type: Documentation
    url: https://business.amwell.com/the-amwell-platform
  - type: Packages
    url: packages/amwell-packages.yml
- aid: amwell:amwell-ehr-integration
  name: Amwell EHR Integration
  description: Amwell's verified embedded-telehealth integration for Epic, delivered
    through the Epic App Orchard, and its embedded telehealth solution inside Oracle
    Cerner Millennium, both launching virtual visits by single sign-on from within
    existing EHR and patient-portal experiences.
  humanURL: https://business.amwell.com/the-amwell-platform/ehr-integration
  tags:
  - EHR
